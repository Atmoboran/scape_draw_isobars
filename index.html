<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Isobaren zeichnen</title>
<meta name="description" content="">
<!-- Structure only. Design: theme/ · texts: content/texts.de.js · layout: css/ · behaviour: js/ -->
<script src="js/view.js" data-app="isobaren"></script>
<link rel="stylesheet" href="theme/theme.css">
<link rel="stylesheet" href="css/kit.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<header class="top">
  <span class="logo" data-brand="logo"></span>
  <div class="top-right">
    <button type="button" class="view-toggle"></button>
  </div>
</header>

<div class="poster small">
  <div class="f f1"></div><div class="f f2"></div><div class="f f3"></div>
  <svg class="l2" viewBox="0 0 120 120" aria-hidden="true">
    <circle cx="60" cy="60" r="30" fill="currentColor"/>
    <circle cx="60" cy="60" r="50" fill="none" stroke="currentColor" stroke-width="7"/>
  </svg>
  <svg class="l3" viewBox="0 0 400 400" aria-hidden="true">
    <ellipse cx="210" cy="200" rx="60" ry="44"/>
    <ellipse cx="200" cy="196" rx="120" ry="92"/>
    <ellipse cx="190" cy="192" rx="180" ry="140"/>
  </svg>
  <div class="poster-text">
    <h1 class="headline" data-t-html="poster.headline"></h1>
    <p class="lead" data-t="poster.lead"></p>
  </div>
</div>

<main class="page">
  <div class="lab">
    <div class="lab-pre">
      <div class="seg mode-row" id="mode-row" role="group" data-t-aria="modes.label"></div>

      <div class="preset-row" id="preset-row" hidden>
        <button type="button" class="sq" id="preset-prev" data-t-aria="presets.prev">&lsaquo;</button>
        <div class="preset-name"><b id="preset-title"></b><span id="preset-count"></span></div>
        <button type="button" class="sq" id="preset-next" data-t-aria="presets.next">&rsaquo;</button>
        <button type="button" class="info" id="preset-info" aria-controls="preset-note" data-t-aria="presets.infoAria"></button>
      </div>
      <div class="info-note" id="preset-note" hidden></div>

      <div class="level-row" id="level-row"></div>
    </div>

    <div class="lab-stage">
      <div class="stage-frame square fit" id="stage-frame">
        <canvas id="board" role="img"></canvas>
      </div>
      <p class="readout status" id="status" aria-live="polite"></p>
      <p class="map-note" id="map-note"></p>
    </div>

    <div class="lab-post">
      <div class="tool-row">
        <div class="seg tools">
          <button type="button" class="btn" id="tool-pen" aria-pressed="true" data-t="tools.pen"></button>
          <button type="button" class="btn" id="tool-eraser" aria-pressed="false" data-t="tools.eraser"></button>
          <button type="button" class="btn" id="tool-hint" aria-pressed="false"><span><span id="tool-hint-label"></span><span class="sub" id="tool-hint-sub"></span></span></button>
          <button type="button" class="btn" id="tool-clear"><span><span data-t="tools.clear"></span><span class="sub" data-t="tools.clearSub"></span></span></button>
        </div>
        <button type="button" class="info" aria-controls="draw-help" data-t-aria="tools.infoAria"></button>
      </div>
      <div class="info-note" id="draw-help" hidden data-t-html="tools.note"></div>

      <div class="readout-grid" aria-live="polite">
        <div><span data-t="readout.stations"></span><b id="ro-stations">–</b></div>
        <div><span data-t="readout.levels"></span><b id="ro-levels">–</b></div>
        <div><span data-t="readout.open"></span><b id="ro-open">0</b></div>
      </div>

      <div class="btn-row">
        <button type="button" class="btn big primary" id="btn-check"><span><span data-t="actions.check"></span><span class="sub" data-t="actions.checkSub"></span></span></button>
        <button type="button" class="btn big" id="btn-undo"><span><span data-t="actions.undo"></span><span class="sub" data-t="actions.undoSub"></span></span></button>
        <button type="button" class="btn big" id="btn-new"><span><span data-t="actions.newMap"></span><span class="sub" data-t="actions.newMapSub"></span></span></button>
      </div>

      <section class="result" id="result" hidden aria-live="polite">
        <div class="result-head">
          <div>
            <div class="result-score"><span id="res-score">0</span> <small data-t="result.of"></small></div>
            <div class="result-verdict" id="res-verdict"></div>
          </div>
          <div class="result-stars" id="res-stars" role="img"></div>
        </div>
        <div class="result-body">
          <div class="crit">
            <div class="crit-top"><span data-t="result.sepLabel"></span><span id="res-sep">0 %</span></div>
            <div class="crit-bar"><i id="bar-sep"></i></div>
            <div class="crit-note" data-t="result.sepNote"></div>
          </div>
          <div class="crit">
            <div class="crit-top"><span data-t="result.smoothLabel"></span><span id="res-smooth">0 %</span></div>
            <div class="crit-bar"><i id="bar-smooth"></i></div>
            <div class="crit-note" data-t="result.smoothNote"></div>
          </div>
          <div class="penalties" id="res-pen"></div>
          <ul class="level-report" id="res-levels"></ul>
          <div class="btn-row result-actions">
            <button type="button" class="btn" id="btn-ref" aria-pressed="false" data-t="result.truth"></button>
            <button type="button" class="btn" id="btn-retry" data-t="result.retry"></button>
          </div>
        </div>
      </section>

      <p class="hint" data-t="hint"></p>

      <div class="tasks" id="iso-tasks">
        <h3 data-t="tasks.title"></h3>
        <ul>
          <li data-task="tutorial"><span class="box"></span><span data-t="tasks.tutorial"></span></li>
          <li data-task="score"><span class="box"></span><span data-t="tasks.score"></span></li>
          <li data-task="truth"><span class="box"></span><span data-t="tasks.truth"></span></li>
        </ul>
        <p class="status" id="task-status" aria-live="polite"></p>
      </div>
      <div class="merke locked" data-for="iso-tasks">
        <h3 data-t="merke.title"></h3>
        <p data-t="merke.text"></p>
        <span class="locked-note"></span>
      </div>
    </div>
  </div>

  <div class="topics">
    <details class="topic"><summary data-t="topics.what.title"></summary><div class="topic-body" data-t-html="topics.what.body"></div></details>
    <details class="topic"><summary data-t="topics.maps.title"></summary><div class="topic-body" data-t-html="topics.maps.body"></div></details>
    <details class="topic"><summary data-t="topics.scoring.title"></summary><div class="topic-body" data-t-html="topics.scoring.body"></div></details>
    <details class="topic"><summary data-t="topics.truth.title"></summary><div class="topic-body" data-t-html="topics.truth.body"></div></details>
    <details class="topic"><summary data-t="topics.modes.title"></summary><div class="topic-body" data-t-html="topics.modes.body"></div></details>
  </div>
</main>

<footer class="foot">
  <p class="sources" data-t="sources"></p>
  <p class="brand-line" data-brand="line"></p>
</footer>

<script src="theme/theme.js"></script>
<script src="content/texts.de.js"></script>
<script src="js/texts.js"></script>
<script src="js/brand.js"></script>
<script src="js/kit.js"></script>
<script src="js/europe.js"></script>
<script src="js/model.js"></script>
<script src="js/render.js"></script>
<script src="js/app.js"></script>
</body>
</html>
